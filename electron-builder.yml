appId: jan.messenger.desktop
productName: Jan Messenger
copyright: Copyright © 2026 Markus Varckin

directories:
  output: release
  buildResources: build

files:
  - src/**/*
  - package.json
  - "!**/*.map"

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: true
  perMachine: false
  artifactName: JanMessenger-Setup-${version}-${arch}.${ext}

publish:
  provider: github
  owner: varckin
  repo: jan-zizka-desktop
  releaseType: release

npmRebuild: false
