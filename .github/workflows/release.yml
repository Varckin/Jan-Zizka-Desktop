name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Build portable x64
        run: npx electron-builder --win portable --x64 --publish never

      - name: Artifacts for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-build
          path: |
            release/*.exe
            release/latest.yml

      - name: Sign update manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
        run: node scripts/sign-update.js release/latest.yml release/update.sig

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            release/*.exe release/latest.yml release/update.sig
