name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Stamp update endpoint into client config
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          (Get-Content src\main\config.js -Raw) `
            -replace "const UPDATE_OWNER = '[^']*';", "const UPDATE_OWNER = '$env:GH_OWNER';" `
            -replace "const UPDATE_REPO = '[^']*';", "const UPDATE_REPO = '$env:GH_REPO';" `
            | Set-Content src\main\config.js -NoNewline

      - name: Build NSIS x64
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Artifacts for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: nsis-build
          path: release/*.exe

      - name: Prepare and sign update manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          UPDATE_SIGN_KEY: ${{ secrets.UPDATE_SIGN_KEY }}
          UPDATE_VERSION: ${{ github.ref_name }}
        run: node scripts/sign-update.js

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            release/*.exe release/latest.yml release/update.sig
